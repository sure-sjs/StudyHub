<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="StudyHub 个人学习导航 —— 集中管理日常学习与生活常用网站，记录使用次数与最近访问。">
<meta name="theme-color" content="#f5f7fb">
<title>StudyHub · 个人学习导航</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip-link" href="#main">跳到主要内容</a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="#" aria-label="StudyHub 首页">
      <span class="brand__mark"><svg class="icon" aria-hidden="true"><use href="#i-cap"/></svg></span>
      <span class="brand__text">
        <span class="brand__name">StudyHub</span>
        <span class="brand__sub">个人学习导航</span>
      </span>
    </a>

    <div class="search" role="search">
      <svg class="icon search__icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input class="search__input" id="search-input" type="search" readonly
             placeholder="搜索网站、用途或标签…" aria-label="搜索网站（V0.2 开放）"
             title="搜索功能将在 V0.2 开放">
      <span class="search__badge">V0.2</span>
    </div>

    <div class="topbar__meta">
      <time class="topbar__date" id="today-date"></time>
      <button class="icon-btn" id="settings-btn" type="button" aria-label="设置" title="设置">
        <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" aria-label="站点导航">
    <nav class="side-group" aria-label="我的导航">
      <p class="side-title"><span class="side-title__bar" aria-hidden="true"></span>我的导航</p>
      <ul class="side-list" id="nav-list">
        <li>
          <button class="side-item is-active" type="button" data-view="all" aria-pressed="true">
            <svg class="icon side-item__icon" aria-hidden="true"><use href="#i-grid"/></svg>
            <span>全部网站</span>
          </button>
        </li>
        <li>
          <button class="side-item" type="button" data-view="favorites" aria-pressed="false">
            <svg class="icon side-item__icon" aria-hidden="true"><use href="#i-star"/></svg>
            <span>我的收藏</span>
          </button>
        </li>
        <li>
          <button class="side-item" type="button" data-view="recent" aria-pressed="false">
            <svg class="icon side-item__icon" aria-hidden="true"><use href="#i-clock"/></svg>
            <span>最近访问</span>
          </button>
        </li>
      </ul>
    </nav>

    <nav class="side-group" aria-label="网站分类">
      <p class="side-title"><span class="side-title__bar" aria-hidden="true"></span>网站分类</p>
      <ul class="side-list" id="category-list"></ul>
    </nav>

    <div class="side-note" aria-hidden="true">
      <svg class="side-note__art" viewBox="0 0 200 96" fill="none">
        <path d="M6 84c22-18 44-26 64-26 20 0 33 7 51 7 14 0 27-3 41-10" stroke="#dfe6f5" stroke-width="2" stroke-linecap="round"/>
        <path d="M28 84V62l22-14 22 14v22z" fill="#e8eefb"/>
        <path d="M70 84V48l26-17 26 17v36z" fill="#dde6f9"/>
        <path d="M122 84V58l18-11 18 11v26z" fill="#e8eefb"/>
        <path d="M150 24l16 6-9 4-3 9z" fill="#bcd0f7"/>
        <path d="M118 22l28 9" stroke="#cfdcf4" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p class="side-note__text">学习，让生活更有可能。</p>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="main__head">
      <div class="main__heading">
        <h1 class="main__title" id="view-title">全部网站</h1>
        <span class="main__count" id="view-count" aria-live="polite"></span>
        <button class="add-btn" id="add-site-btn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>添加网站
        </button>
      </div>
      <div class="sort" role="group" aria-label="排序方式">
        <button class="sort__btn is-active" type="button" data-sort="visits" aria-pressed="true">
          <svg class="icon" aria-hidden="true"><use href="#i-flame"/></svg>使用次数
        </button>
        <button class="sort__btn" type="button" data-sort="recent" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>最近使用
        </button>
        <button class="sort__btn" type="button" data-sort="name" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg>名称
        </button>
      </div>
    </div>

    <section class="grid" id="site-grid" aria-label="网站列表"></section>

    <div class="empty" id="empty-state" hidden>
      <span class="empty__icon"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg></span>
      <p class="empty__title" id="empty-title">这里还没有内容</p>
      <p class="empty__hint" id="empty-hint"></p>
    </div>

    <section class="overview" id="overview" aria-label="概览">
      <article class="panel">
        <header class="panel__head">
          <span class="panel__icon panel__icon--star"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg></span>
          <h2 class="panel__title">我的收藏</h2>
          <button class="panel__more" type="button" data-view="favorites">查看全部<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
        </header>
        <div class="panel__body" id="favorites-body"></div>
      </article>

      <article class="panel">
        <header class="panel__head">
          <span class="panel__icon panel__icon--clock"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg></span>
          <h2 class="panel__title">最近访问</h2>
          <button class="panel__more" type="button" data-view="recent">查看全部<svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
        </header>
        <div class="panel__body" id="recent-body"></div>
      </article>
    </section>
  </main>
</div>

<footer class="footer">
  <p class="footer__line"><strong>StudyHub V0.1.1</strong><span class="footer__dot">·</span>个人学习导航<span class="footer__dot">·</span>纯静态页面<span class="footer__dot">·</span>数据保存在本地浏览器</p>
</footer>

<dialog class="dialog" id="site-dialog" aria-labelledby="dialog-title">
  <form class="dialog__form" id="site-form" novalidate>
    <header class="dialog__head">
      <h2 class="dialog__title" id="dialog-title">添加网站</h2>
      <button class="dialog__close" type="button" data-close aria-label="关闭">
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </header>

    <div class="dialog__body">
      <div class="field">
        <label class="field__label" for="f-name">网站名称<span class="field__req">*</span></label>
        <input class="field__input" id="f-name" type="text" maxlength="30" autocomplete="off"
               placeholder="例如：中国大学MOOC" required>
        <p class="field__error" id="err-name" role="alert"></p>
      </div>

      <div class="field">
        <label class="field__label" for="f-url">网站网址<span class="field__req">*</span></label>
        <input class="field__input" id="f-url" type="text" autocomplete="off" spellcheck="false"
               placeholder="https://www.icourse163.org" required>
        <p class="field__hint">缺少 https:// 时会自动补全</p>
        <p class="field__error" id="err-url" role="alert"></p>
      </div>

      <div class="field">
        <label class="field__label" for="f-category">所属分类<span class="field__req">*</span></label>
        <select class="field__input field__select" id="f-category" required></select>
        <p class="field__error" id="err-category" role="alert"></p>
      </div>

      <div class="field">
        <label class="field__label" for="f-desc">用途说明<span class="field__optional">选填</span></label>
        <textarea class="field__input field__textarea" id="f-desc" rows="2" maxlength="60"
                  placeholder="一句话说明这个网站用来做什么"></textarea>
        <p class="field__error" id="err-desc" role="alert"></p>
      </div>

      <div class="field">
        <label class="field__label" for="f-tags">标签<span class="field__optional">选填</span></label>
        <input class="field__input" id="f-tags" type="text" autocomplete="off"
               placeholder="用逗号分隔，最多 3 个">
        <p class="field__hint">例如：课程, 公开课, 视频</p>
        <p class="field__error" id="err-tags" role="alert"></p>
      </div>
    </div>

    <footer class="dialog__foot">
      <button class="btn btn--ghost" type="button" data-close>取消</button>
      <button class="btn btn--primary" type="submit" id="site-submit">保存网站</button>
    </footer>
  </form>
</dialog>

<dialog class="dialog dialog--confirm" id="confirm-dialog" aria-labelledby="confirm-title">
  <div class="dialog__body dialog__body--confirm">
    <span class="confirm__icon" aria-hidden="true">
      <svg class="icon"><use href="#i-trash"/></svg>
    </span>
    <h2 class="dialog__title" id="confirm-title">删除网站</h2>
    <p class="confirm__text" id="confirm-text"></p>
  </div>
  <footer class="dialog__foot dialog__foot--center">
    <button class="btn btn--ghost" type="button" data-close>取消</button>
    <button class="btn btn--danger" type="button" id="confirm-delete">删除</button>
  </footer>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
